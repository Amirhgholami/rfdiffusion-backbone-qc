[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdiffusion-backbone-qc"
version = "0.1.0"
description = "Structural quality assessment for RFdiffusion-generated protein backbones"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "biopython",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]